[build]
  publish = "."
  command = "node build-env.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Security headers ─────────────────────────────────────────
# The CSP has no 'unsafe-inline' in script-src: all behaviour lives in the
# module files, and image error fallbacks are delegated listeners rather than
# inline onerror="…" handlers. 'unsafe-inline' is still needed for style-src
# because day colours and layout offsets are set as inline style attributes.
[[headers]]
  for = "/*"
  [headers.values]
    # Kept on one line: header values cannot contain newlines, and TOML
    # multi-line strings preserve them.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://unpkg.com https://upload.wikimedia.org https://images.unsplash.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com https://en.wikipedia.org https://upload.wikimedia.org https://photon.komoot.io https://nominatim.openstreetmap.org https://router.project-osrm.org https://overpass-api.de https://overpass.kumi.systems https://overpass.private.coffee https://images.unsplash.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# HTML and the service worker must never be served stale, or users get stuck
# on an old build.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ────────────────────────────────────────────────
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
